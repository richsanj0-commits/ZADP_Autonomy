; ZADP truck robot firmware (one ESP32 DevKit per robot). See ../README.md.
; Build and flash one robot:   pio run -e bot1 -t upload      (bot2, bot3 for the others)
; Serial monitor:              pio device monitor -e bot1
;
; Pinned versions (reproducible first build):
;   platform espressif32 @ 7.0.1  = the platform already installed in the local PlatformIO cache of the development
;       PC; it brings framework-arduinoespressif32 3.20017 = arduino-esp32 core 2.0.17 (ESP-IDF 4.4.7, FreeRTOS
;       10.4.3) and toolchain-xtensa-esp32 8.4.0. Pinning it means `pio run` does not fetch a newer platform.
;       The code also has the arduino-esp32 3.x / ESP-IDF 5.x branches (LEDC by pin, pulse_cnt driver, TWDT
;       reconfigure); those need the community pioarduino platform and were not compiled here.
;   knolleary/PubSubClient @ 2.8  = the last release (2020); exact pin.
;   bblanchon/ArduinoJson @ 7.2.1 = a v7 release (JsonDocument API used by comms_task.cpp); exact pin.
; The two libraries are NOT in the local cache: the first build downloads them (needs internet once).
; If the registry ever refuses an exact version, use `@ ~2.8` / `@ ^7.2.1` (same APIs).

[env]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 460800
lib_deps =
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ 7.2.1
; motion_core.h is C++11-clean; build with C++17 anyway (arduino-esp32 2.x defaults to gnu++11).
; ARDUINOJSON_USE_DOUBLE: the camera time stamp t (~1.8e9 s) needs double precision.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_USE_DOUBLE=1
; the host test is plain C++ (test/host), not a PlatformIO unit test
test_ignore = *

[env:bot1]
build_flags = ${env.build_flags} -DBOT_ID=1

[env:bot2]
build_flags = ${env.build_flags} -DBOT_ID=2

[env:bot3]
build_flags = ${env.build_flags} -DBOT_ID=3

; PCB robots: BIN2 is on GPIO 5 instead of 33 (see include/config.h)
[env:bot1_pcb]
build_flags = ${env.build_flags} -DBOT_ID=1 -DPIN_BIN2=5

[env:bot2_pcb]
build_flags = ${env.build_flags} -DBOT_ID=2 -DPIN_BIN2=5

[env:bot3_pcb]
build_flags = ${env.build_flags} -DBOT_ID=3 -DPIN_BIN2=5

; Fallback if the PCNT encoders misbehave on a robot: the previous GPIO-interrupt decoder (same counts and signs)
[env:bot1_isr]
build_flags = ${env.build_flags} -DBOT_ID=1 -DENC_USE_PCNT=0
